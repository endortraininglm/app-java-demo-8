# =============================================================================
# REUSABLE WORKFLOW — Point 1 — Scan Release Branch on Create/Push
# =============================================================================
# Adapted from the ACA proposal draft
# (shared/endor-release-branch-scan.yml) for local validation in this repo.
# Uses the keyless github_action_token auth pattern already proven on the
# setup_gha_scan branch (namespace: leonardo-learn).
#
# Purpose:
#   When a release branch is created or pushed, run an Endor scan
#   (dependencies + secrets) against the leonardo-learn namespace. This is
#   the trigger validation for ACA's Point 1 architecture.
# =============================================================================

name: Endor - Release Branch Scan (Point 1)

on:
  workflow_call:
    inputs:
      namespace:
        description: 'Endor Labs namespace.'
        required: false
        type: string
        default: 'leonardo-learn'
      project_name:
        description: 'Endor project name. Defaults to the calling repository.'
        required: false
        type: string
        default: ''
      scan_sast:
        description: 'Enable SAST scanning.'
        required: false
        type: boolean
        default: false
      scan_secrets:
        description: 'Enable secrets scanning.'
        required: false
        type: boolean
        default: true

jobs:
  release-branch-scan:
    name: Endor release branch scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Keyless auth to Endor via GitHub Action token

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for diff vs. master baseline.

      - name: Endor scan (establishes release-branch baseline)
        # continue-on-error is required here, not just omitting
        # --exit-on-policy-warning: that flag only controls WARN-level
        # policy violations. A namespace-level blocking Admission policy
        # (finding severity, license, etc.) still makes endorctl exit
        # non-zero even with pr:false and no policy-warning flag, which
        # would otherwise fail this baseline-establishing job. Confirmed
        # via a real leonardo-learn scan that hit exactly this case
        # (Admission blocked by policy -> exit code 128) before this
        # was added.
        continue-on-error: true
        uses: endorlabs/github-action@v1
        with:
          namespace: ${{ inputs.namespace }}
          enable_github_action_token: true

          # pr: false -> creates a tracked monitored version for this
          # release branch.
          pr: false

          scan_dependencies: true
          scan_secrets: ${{ inputs.scan_secrets }}
          scan_sast: ${{ inputs.scan_sast }}

          project_name: ${{ inputs.project_name }}

          tags: |
            ci=github-actions
            point=1-release-branch-baseline
            release-branch=${{ github.ref_name }}
      
            # The scan action does not guarantee endorctl remains available to
      
      # later shell steps, so use its supported setup action.
      - name: Install endorctl
        uses: endorlabs/github-action/setup@v1
        with:
          namespace: ${{ inputs.namespace }}
          enable_github_action_token: true
      
      - name: Allow release branch as a PR scan target
        env:
          ENDOR_NAMESPACE: ${{ inputs.namespace }}
          BRANCH_NAME: ${{ github.ref_name }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_UUID=$(
            endorctl api get \
              -r Project \
              -n "$ENDOR_NAMESPACE" \
              --name "$REPOSITORY_URL" \
            | jq -er '.uuid'
          )
          mapfile -t REPOSITORY_VERSIONS < <(
            endorctl api list \
              -r RepositoryVersion \
              -n "$ENDOR_NAMESPACE" \
              --filter "meta.parent_uuid==$PROJECT_UUID" \
              --field-mask \
                "uuid,context.type,spec.version.ref,spec.allow_ref_as_pr_scan_base,scan_object.status" \
              --list-all \
              --timeout 120s \
            | jq -c \
                --arg ref "$BRANCH_NAME" \
                '.list.objects[]
                 | select(
                     .context.type == "CONTEXT_TYPE_REF"
                     and .spec.version.ref == $ref
                   )'
          )
          if [[ ${#REPOSITORY_VERSIONS[@]} -ne 1 ]]; then
            echo "Expected one REF RepositoryVersion for $BRANCH_NAME; found ${#REPOSITORY_VERSIONS[@]}."
            exit 1
          fi
          REPOSITORY_VERSION="${REPOSITORY_VERSIONS[0]}"
          REPOSITORY_VERSION_UUID=$(jq -r '.uuid' <<<"$REPOSITORY_VERSION")
          SCAN_STATUS=$(jq -r '.scan_object.status' <<<"$REPOSITORY_VERSION")
          ALREADY_ENABLED=$(
            jq -r '.spec.allow_ref_as_pr_scan_base // false' \
              <<<"$REPOSITORY_VERSION"
          )
          if [[ "$SCAN_STATUS" != "STATUS_SCANNED" ]]; then
            echo "RepositoryVersion is not scanned: $SCAN_STATUS"
            exit 1
          fi
          if [[ "$ALREADY_ENABLED" == "true" ]]; then
            echo "$BRANCH_NAME is already enabled as a PR scan target."
            exit 0
          fi
          endorctl api update \
            -r RepositoryVersion \
            -n "$ENDOR_NAMESPACE" \
            --uuid "$REPOSITORY_VERSION_UUID" \
            --field-mask "spec.allow_ref_as_pr_scan_base" \
            --data '{"spec":{"allow_ref_as_pr_scan_base":true}}'
          endorctl api get \
            -r RepositoryVersion \
            -n "$ENDOR_NAMESPACE" \
            --uuid "$REPOSITORY_VERSION_UUID" \
            --field-mask "spec.allow_ref_as_pr_scan_base" \
          | jq -e '.spec.allow_ref_as_pr_scan_base == true'
          echo "$BRANCH_NAME is enabled as a PR scan target."